<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — FoDigits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&family=Outfit:wght@400;500;600;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%232a4b3d' width='32' height='32' rx='8'/%3E%3Ctext x='8' y='23' fill='%23f4efe6' font-family='Georgia' font-size='18'%3EF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="kicker">The desk</span>
        <h1>Write to the studio.</h1>
      </div>
    </section>
    <section>
      <div class="wrap split">
        <div class="prose">
          <p>Licenses, white-label, or a product that is not on the shelf yet — send a note. We read them.</p>
          <p><strong>Studio</strong><br /><a href="mailto:hello@fodigits.com">hello@fodigits.com</a></p>
          <p><strong>Support</strong><br /><a href="mailto:support@fodigits.com">support@fodigits.com</a></p>
        </div>
        <form class="form-card" id="contactForm">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" placeholder="White-label for Clinic" />
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button class="btn btn-forest btn-block" type="submit">Send</button>
          <p class="status" id="contactStatus" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var status = document.getElementById("contactStatus");
      var btn = e.target.querySelector("button");
      var data = Object.fromEntries(new FormData(e.target).entries());
      btn.disabled = true;
      fetch("/api/contact", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          status.textContent = res.j.message || res.j.error;
          status.className = "status " + (res.ok && res.j.ok ? "ok" : "err");
          if (res.ok && res.j.ok) e.target.reset();
        })
        .catch(function () { status.textContent = "Network error."; status.className = "status err"; })
        .finally(function () { btn.disabled = false; });
    });
  </script>
</body>
</html>
