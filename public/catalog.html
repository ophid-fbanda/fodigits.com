<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download FoDigits software — self-hosted tools by category." />
  <title>Software catalog — FoDigits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%234f8cff' width='32' height='32' rx='8'/%3E%3Ctext x='9' y='22' fill='white' font-family='Arial' font-weight='700' font-size='16'%3EF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="kicker">Catalog</span>
        <h1>Products</h1>
        <p>Twelve applications. Filter by category and download a Docker or Linux package.</p>
      </div>
    </section>
    <section>
      <div class="wrap" style="padding-bottom:80px">
        <div class="toolbar">
          <input class="search" id="q" type="search" placeholder="Search the catalog…" />
        </div>
        <div class="cats" id="cats"></div>
        <p id="count" style="margin:22px 0 16px;color:var(--mute)"></p>
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/js/store.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var current = params.get("cat") || "all";
      var query = "";

      FoStore.loadCatalog().then(function (data) {
        var cats = [{ id: "all", name: "All" }].concat(data.categories);
        function paint() {
          var list = data.products.filter(function (p) {
            var inCat = current === "all" || p.category === current;
            var hay = (p.name + " " + p.short + " " + p.category).toLowerCase();
            return inCat && hay.indexOf(query) !== -1;
          });
          FoStore.renderGrid(document.getElementById("grid"), list, data.categories);
          document.getElementById("count").textContent = list.length + (list.length === 1 ? " product" : " products");
          document.querySelectorAll("#cats .cat").forEach(function (el) {
            el.classList.toggle("is-on", el.getAttribute("data-id") === current);
          });
        }

        document.getElementById("cats").innerHTML = cats.map(function (c) {
          return '<button type="button" class="cat" data-id="' + c.id + '">' + c.name + "</button>";
        }).join("");
        document.getElementById("cats").addEventListener("click", function (e) {
          var btn = e.target.closest("[data-id]");
          if (!btn) return;
          current = btn.getAttribute("data-id");
          var url = new URL(location.href);
          if (current === "all") url.searchParams.delete("cat");
          else url.searchParams.set("cat", current);
          history.replaceState(null, "", url);
          paint();
        });
        document.getElementById("q").addEventListener("input", function (e) {
          query = e.target.value.trim().toLowerCase();
          paint();
        });
        paint();
      });
    })();
  </script>
</body>
</html>
