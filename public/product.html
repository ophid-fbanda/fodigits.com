<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download a FoDigits product and host it yourself." />
  <title>Product — FoDigits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%234f8cff' width='32' height='32' rx='8'/%3E%3Ctext x='9' y='22' fill='white' font-family='Arial' font-weight='700' font-size='16'%3EF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="wrap" id="root" style="padding-bottom:40px">
      <p class="page-hero">Loading product…</p>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/site.js"></script>
  <script src="/js/store.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get("p");
      var root = document.getElementById("root");
      if (!slug) {
        root.innerHTML = '<section class="page-hero"><h1>Missing product.</h1><p><a href="/catalog">Back to the catalog.</a></p></section>';
        return;
      }
      fetch("/api/product/" + encodeURIComponent(slug)).then(function (r) { return r.json(); }).then(function (data) {
        if (!data.ok) {
          root.innerHTML = '<section class="page-hero"><h1>Product not found.</h1><p><a href="/catalog">View products</a></p></section>';
          return;
        }
        var p = data.product;
        document.title = p.name + " — FoDigits";
        var platforms = p.platforms.map(function (x) {
          return '<option value="' + x.id + '">' + x.label + "</option>";
        }).join("");
        var editions = p.editions.map(function (x) {
          return '<option value="' + x + '">' + x + "</option>";
        }).join("");
        var bullets = p.highlights.map(function (h) { return "<li>" + h + "</li>"; }).join("");
        var badge = p.badge ? '<span class="pill">' + p.badge + "</span>" : "";
        var installCopy = {
          docker: "<h3>Docker Compose</h3><p>Copy <code>.env.example</code> to <code>.env</code>. Set <code>LICENSE_KEY</code>. From the package folder run <code>docker compose up -d</code>.</p>",
          linux: "<h3>Linux</h3><p>Unpack the archive. Follow the install script in the README. Enable the systemd unit. Set the license in the env file.</p>",
          windows: "<h3>Windows</h3><p>Run the installer. Enter the license key. Start the app from the Start menu or as a Windows service.</p>"
        };
        var installBlocks = (p.platforms || []).map(function (x) {
          return '<article class="step">' + (installCopy[x.id] || "<h3>" + x.label + "</h3><p>See the README in the package.</p>") + "</article>";
        }).join("");

        root.innerHTML = `
          <section class="page-hero">
            <a class="kicker" href="/catalog?cat=${p.category}">${FoStore.categoryName(data.categories, p.category)} →</a>
            <h1>${p.name}</h1>
            <p>${p.short}</p>
          </section>
          <section class="detail">
            <div>
              <div class="stage">
                <div class="stage-top"><span class="orb" style="background:${p.tone || "#4f8cff"}">${p.name.replace("FoDigits ", "").slice(0, 1)}</span></div>
                <div class="stage-copy">
                  <div class="meta">${badge}<span class="tag">v${p.version} · ${p.released}</span></div>
                  <p>${p.description}</p>
                  <p>${p.story}</p>
                  <ul class="bullets">${bullets}</ul>
                </div>
              </div>
            </div>
            <aside class="panel">
              <h2>Download</h2>
              <div class="dl-meta">
                <div><span>Version</span><strong>${p.version}</strong></div>
                <div><span>Released</span><strong>${p.released}</strong></div>
                <div><span>Requirements</span><strong style="text-align:right;max-width:60%">${p.requirements}</strong></div>
                <div><span>Recorded downloads</span><strong>${p.downloads.toLocaleString()}</strong></div>
              </div>
              <form id="dl" data-slug="${p.slug}">
                <div class="field">
                  <label for="edition">Edition</label>
                  <select id="edition" name="edition">${editions}</select>
                </div>
                <div class="field">
                  <label for="platform">Package</label>
                  <select id="platform" name="platform">${platforms}</select>
                </div>
                <label class="check">
                  <input type="checkbox" name="agree" />
                  <span>I accept the <a href="/licenses" target="_blank">license terms</a>.</span>
                </label>
                <button class="btn btn-primary btn-block" data-download type="submit">Download package</button>
                <div class="progress" aria-hidden="true"><i></i></div>
                <p class="status" role="status"></p>
              </form>
            </aside>
          </section>
          <section class="section" style="padding-top:8px">
            <div class="section-head">
              <span class="kicker">Install ${p.name.replace("FoDigits ", "")}</span>
              <h2>Packages for this product</h2>
              <p>${p.requirements}</p>
            </div>
            <div class="steps">${installBlocks}</div>
          </section>`;
        FoStore.bindDownload(document.getElementById("dl"));
      }).catch(function () {
        root.innerHTML = '<section class="page-hero"><h1>Unable to load product.</h1><p>Retry in a moment.</p></section>';
      });
    })();
  </script>
</body>
</html>
